version: '3.8'

services:
  # NVIDIA Triton Inference Server with GPU Passthrough
  triton_server:
    image: nvcr.io/nvidia/tritonserver:24.08-py3
    container_name: visionport_triton
    restart: always
    shm_size: '8gb'
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "8000:8000"  # HTTP REST API
      - "8001:8001"  # gRPC API
      - "8002:8002"  # Prometheus Metrics
    volumes:
      - ./model_repository:/models
    command: ["tritonserver", "--model-repository=/models", "--strict-model-config=false", "--log-verbose=0"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # VisionPort FastAPI Gateway & Orchestrator
  api_gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: visionport_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - TRITON_URL=triton_server:8001
      - LOG_LEVEL=info
    depends_on:
      - triton_server

  # Prometheus Telemetry Monitor
  prometheus:
    image: prom/prometheus:latest
    container_name: visionport_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

